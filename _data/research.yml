  - number: "05"
    title_en: Compare
    title_ko: 비교
    description_en: Compare first-player bluffing, two-sided bluffing, bluff-catching, and FAKE CHECK.
    description_ko: 선공 블러프, 양측 블러프, 블러프 캐치와 FAKE CHECK를 비교합니다.
  - number: "06"

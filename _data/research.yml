method:
  - number: "01"
    title_en: Observe
    title_ko: 관찰
    description_en: Find recurring player heuristics and unresolved strategic debates.
    description_ko: 플레이어들이 반복적으로 논쟁하는 경험칙을 발견합니다.
  - number: "02"
    title_en: Formalize
    title_ko: 정식화
    description_en: Define rules, information sets, actions, payoffs, and the scope of analysis.
    description_ko: 규칙, 정보집합, 행동, 보수와 분석 범위를 정의합니다.
  - number: "03"
    title_en: Model
    title_ko: 모형화
    description_en: Build reduced models with probability, Bayesian inference, and game theory.
    description_ko: 확률론, 베이즈 추론과 게임이론으로 축약모형을 구성합니다.
  - number: "04"
    title_en: Compute
    title_ko: 계산
    description_en: Run exact calculations, dynamic programming, CFR, or simulation as appropriate.
    description_ko: 정확 계산, 동적계획법, CFR 또는 시뮬레이션을 실행합니다.
  - number: "05"
    title_en: Validate
    title_ko: 검증
    description_en: Test sensitivity, best responses, robustness, and exploitability.
    description_ko: 민감도, 최적 반응, 강건성과 피착취성을 검토합니다.
  - number: "06"
    title_en: Explain
    title_ko: 설명
    description_en: Publish technical reports, code, visualizations, and player-facing explanations.
    description_ko: 기술보고서, 코드, 시각화와 플레이어용 해설로 공개합니다.

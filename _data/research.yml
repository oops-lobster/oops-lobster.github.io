featured:
  - slug: indian-poker
    game: Indian Poker
    status_key: completed
    status_en: Completed
    status_ko: 완료
    year: 2023
    type_en: Graduation Research
    type_ko: 졸업연구
    title_en: A Study on Indian Poker Bluffing Strategies Using Probabilistic Methods
    title_ko: 확률론적 방법을 활용한 블러핑 고려 인디언 포커 연구
    summary_en: Starting from the ordinary 20-card game, this report builds a two-player AKQ abstraction and uses probability and expected value to examine bluffing, bluff-catching, and deceptive checking.
    summary_ko: 일반적인 20장 게임에서 출발해 2인 A·K·Q 축약모형을 만들고, 확률과 기대값으로 블러프·블러프 캐치·기만적 체크를 분석한 보고서입니다.
    highlights_en:
      - Examines ordinary 20-card Indian Poker before reducing it to an AKQ model
      - Shows how deterministic betting can reveal information and become exploitable
      - Derives conditions for first-player bluffing and second-player bluff-catching
      - Compares first-player-only and two-player bluffing, including FAKE CHECK
      - Summarizes mixed strategies within the stated simplified model
    highlights_ko:
      - 일반적인 20장 인디언 포커를 살핀 뒤 A·K·Q 모형으로 축약
      - 결정론적 베팅이 정보를 드러내 피착취될 수 있음을 분석
      - 선공의 블러프와 후공의 블러프 캐치 조건을 기대값으로 도출
      - 선공만 블러프하는 경우와 양쪽 모두 블러프하는 경우 및 FAKE CHECK 비교
      - 명시한 축약모형 안에서 혼합전략을 정리
    methods:
      - Expected Value
      - Probability
      - Mixed Strategy
      - Game Abstraction
    report_url: /assets/reports/indian-poker-bluffing-strategies-2023.pdf
    analysis_url:


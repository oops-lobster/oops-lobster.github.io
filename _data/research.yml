featured:
  - slug: indian-poker
    game: Indian Poker
    status_key: completed
    status_en: Completed
    status_ko: 완료
    year: 2023
    type_en: Graduation Research
    type_ko: 졸업연구
    title_en: A Study on Indian Poker Bluffing Strategies Using Probabilistic Methods
    title_ko: 확률론적 방법을 활용한 블러핑 고려 인디언포커 연구
    summary_en: Reduced a 20-card Indian Poker game to a three-card AKQ abstraction and examined mixed bluffing, checking, and bluff-catching strategies using expected-value indifference conditions.
    summary_ko: 20장 인디언포커를 A·K·Q 3장 게임으로 추상화하고, 기대값 무차별 조건을 이용해 블러프·체크·블러프 캐치의 혼합전략을 분석했습니다.
    highlights_en:
      - Converted the 20-card game into an AKQ abstraction
      - Examined how deterministic betting becomes exploitable
      - Derived card-dependent mixes of bluffs, checks, and raises
      - Analyzed bluff-catching thresholds
      - Proposed a deceptive checking strategy
    highlights_ko:
      - 20장 게임을 A·K·Q 축약모형으로 변환
      - 결정론적 베팅의 피착취성 분석
      - 카드별 블러프·체크·레이즈 혼합전략 도출
      - 블러프 캐치 임계조건 분석
      - 페이크 체크 전략 제안
    methods:
      - Expected Value
      - Probability
      - Mixed Strategy
      - Game Abstraction
    report_url:
    analysis_url:
    link_state_en: Report coming soon
    link_state_ko: 보고서 공개 예정

  - slug: mafia42
    game: Mafia42
    status_key: in-progress
    status_en: In Progress
    status_ko: 진행 중
    type_en: Independent Research
    type_ko: 독립 연구
    title_en: Strategic Counterclaims in Mafia42 Classic Eight-Player Mode
    title_ko: 마피아42 클래식 8인판의 직업 사칭과 대응 전략 분석
    summary_en: A computational study of claim, counterclaim, and elimination strategies in Mafia42’s classic eight-player mode, focusing on player heuristics such as 맞경, 맞의, 맞경크, and 찍경크.
    summary_ko: 마피아42 클래식 8인판에서 맞경·맞의·맞경크·찍경크와 같은 경험적 전략을 주장, 맞주장, 처형 선택의 계산 문제로 바꾸는 연구입니다.
    questions_en:
      - When is 맞경크 preferable to 찍경크 after competing police claims?
      - How should role claims and investigation results update each player’s posterior probability?
      - Is eliminating the most suspicious player always the same as maximizing the citizen team’s win probability?
      - How does a third faction change the value of confirmed roles and faction information?
    questions_ko:
      - 맞경 상황에서 맞경크와 찍경크 중 어느 전략이 유리한가?
      - 직업 주장과 조사 결과는 각 플레이어의 사후확률을 어떻게 바꾸는가?
      - 가장 의심스러운 플레이어를 처형하는 선택과 시민팀 승률을 최대화하는 선택은 항상 같은가?
      - 교주판 등 제3세력은 확정직과 진영 정보의 가치를 어떻게 바꾸는가?
    methods:
      - Bayesian Inference
      - State-Transition Modeling
      - Monte Carlo Simulation
      - Imperfect-Information Games
    report_url:
    analysis_url:
    link_state_en: Study in progress
    link_state_ko: 연구 진행 중


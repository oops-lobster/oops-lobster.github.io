  - number: "03"
    title_en: Abstract
    title_ko: 추상화
    description_en: Reduce the game to a two-player AKQ model without replacement.
    description_ko: 비복원 추출을 따르는 2인 A·K·Q 모형으로 게임을 축약합니다.
  - number: "04"

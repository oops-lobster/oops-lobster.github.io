<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>인천–영종도 가족여행</title><style>body{margin:0;background:#f4f0e7;color:#334;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}#loading{padding:38px 24px;font-size:16px}</style></head><body><div id="loading">여행 가이드를 여는 중…</div><script>window.__b=[];</script><script src="./c1.js?v=1"></script><script src="./c2.js?v=1"></script><script src="./c3.js?v=1"></script><script src="./c4.js?v=1"></script><script src="./c5.js?v=1"></script><script src="./c6.js?v=1"></script><script src="./c7.js?v=1"></script><script src="./c8.js?v=1"></script><script src="./c9.js?v=1"></script><script>(function(){try{var bin=atob(window.__b.join('')),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);var t;if(typeof TextDecoder!=="undefined"){t=new TextDecoder("utf-8").decode(a)}else{var e="";for(var j=0;j<a.length;j++)e+="%"+("0"+a[j].toString(16)).slice(-2);t=decodeURIComponent(e)}document.open();document.write(t);document.close()}catch(err){document.getElementById("loading").textContent="가이드 로딩 오류: "+(err&&err.message?err.message:String(err))}})();</script></body></html>
